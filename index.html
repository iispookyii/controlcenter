<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Center — Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell" id="loginShell">
  <!-- Section 1: Lamp hero (first thing you see) -->
  <div class="lamp-hero">
    <div class="lamp-hero-inner">
      <div class="lamp">
        <div class="lamp-cord"></div>
        <div class="lamp-shade"></div>
        <div class="lamp-arm"></div>
        <div class="lamp-joint"></div>
        <div class="lamp-stand"></div>
        <div class="lamp-base"></div>
        <div class="lamp-glow"></div>
        <div class="lamp-drop"></div>
      </div>
      <div class="lamp-hero-text">
        <h1>Control Center</h1>
        <p>Office management system</p>
      </div>
      <div class="lamp-hero-hint">
        Sign in with Google to continue
      </div>
    </div>
  </div>

  <!-- Section 2: Google login card -->
  <div class="login-card">
    <div class="login-card-body">
      <div class="login-brand">Control Center</div>
      <div class="login-sub">Sign in with your office Google account</div>

      <div class="google-note">
        <span style="font-weight:800;color:var(--teal-dark);">Gmail only</span>
        &bull; Admin access: <span style="font-weight:800;color:var(--teal-dark);">dcchamie25@gmail.com</span>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <!-- Honeypot field (hidden, must stay empty) -->
        <div class="honeypot" style="position:absolute;left:-9999px;opacity:0;">
          <label>Please leave this field empty.</label>
          <input type="text" id="hp" name="hp" tabindex="-1" autocomplete="off">
        </div>

        <!-- reCAPTCHA (simulated v2 checkbox) -->
        <div class="recaptcha-wrap">
          <div class="recaptcha-box" id="recaptchaBox" role="checkbox" tabindex="0" aria-checked="false">
            <div class="recaptcha-icon" id="recaptchaIcon">&#10003;</div>
            <span class="recaptcha-label">I'm not a robot</span>
          </div>
          <div class="recaptcha-hint" id="recaptchaHint" style="display:none;color:#d32f2f;font-size:0.8rem;font-weight:700;margin-top:6px;">Please complete the reCAPTCHA.</div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Continue with Google &rarr;</button>
      </form>

      <div id="loginError" style="color:#d32f2f;font-weight:700;font-size:0.8rem;display:none;margin-top:12px;text-align:center;"></div>
      <div class="login-footer">
        Office Control Center &bull; Main Admin: dcchamie25@gmail.com
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
