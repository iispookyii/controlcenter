<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Center — Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell" id="loginShell">
  <!-- Left teal panel -->
  <div class="login-left">
    <div class="left-panel">
      <h1>Control Center</h1>
      <p>Office management system</p>
    </div>
  </div>

  <!-- Right sign-in card -->
  <div class="login-right">
    <div class="login-card">
      <div class="card-header">
        <h2>Sign in</h2>
        <p class="sub">Sign in to continue to your office dashboard</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <!-- Honeypot field (hidden, must stay empty) -->
        <div class="honeypot" style="position:absolute;left:-9999px;opacity:0;">
          <label>Please leave this field empty.</label>
          <input type="text" id="hp" name="hp" tabindex="-1" autocomplete="off">
        </div>

        <!-- reCAPTCHA (simulated v2 checkbox) -->
        <div class="recaptcha-wrap">
          <div class="recaptcha-box" id="recaptchaBox" role="checkbox" tabindex="0" aria-checked="false">
            <div class="recaptcha-icon" id="recaptchaIcon">&#10003;</div>
            <span class="recaptcha-label">I'm not a robot</span>
          </div>
          <div class="recaptcha-hint" id="recaptchaHint" style="display:none;color:#d32f2f;font-size:0.8rem;font-weight:700;margin-top:6px;">Please complete the reCAPTCHA.</div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Continue with Google &rarr;</button>
      </form>

      <div id="loginError" style="color:#d32f2f;font-weight:700;font-size:0.8rem;display:none;margin-top:12px;text-align:center;"></div>

      <div class="login-footer">
        Office Control Center &bull; Secure Google sign-in
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
