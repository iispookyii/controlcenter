<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounting Certification &amp; Training Institute — Verify Your Identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-3d-body">

<div class="auth-page-container">
  <!-- Subtle background ripple contours matching ACTI reference -->
  <svg class="bg-ripple-waves" viewBox="0 0 1200 900" aria-hidden="true">
    <defs>
      <radialGradient id="tealWaveGlow" cx="60%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
        <stop offset="45%" stop-color="#0d9488" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#022d34" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="850" cy="500" r="220" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="60" />
    <circle cx="850" cy="500" r="380" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="85" />
    <circle cx="850" cy="500" r="560" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="115" />
    <circle cx="850" cy="500" r="760" fill="none" stroke="rgba(255,255,255,0.018)" stroke-width="145" />
    <circle cx="850" cy="500" r="420" fill="url(#tealWaveGlow)" />
  </svg>

  <!-- Top ACTI Brand Bar -->
  <header class="acti-brand-header">
    <div class="acti-seal-badge">
      <svg class="seal-svg" viewBox="0 0 120 120" width="76" height="76">
        <circle cx="60" cy="60" r="58" fill="#ffffff" />
        <circle cx="60" cy="60" r="55" fill="none" stroke="#085f6c" stroke-width="2.5" />
        <circle cx="60" cy="60" r="49" fill="none" stroke="#085f6c" stroke-width="1" stroke-dasharray="2,2" />
        <circle cx="60" cy="60" r="35" fill="none" stroke="#085f6c" stroke-width="1.5" />
        <defs>
          <path id="sealTextPath" d="M 18,60 A 42,42 0 1,1 102,60 A 42,42 0 0,1 18,60" />
        </defs>
        <text font-family="'Poppins', sans-serif" font-size="6.8" font-weight="700" fill="#085f6c" letter-spacing="0.7">
          <textPath href="#sealTextPath" startOffset="50%" text-anchor="middle">
            ACCOUNTING CERTIFICATION &amp; TRAINING INSTITUTE
          </textPath>
        </text>
        <text x="60" y="101" font-family="'Poppins', sans-serif" font-size="8" fill="#085f6c" text-anchor="middle" letter-spacing="3">★ ★ ★</text>
        <!-- Stylized AC monogram with eagle head in center -->
        <g transform="translate(60, 58) scale(0.72)" fill="#085f6c">
          <path d="M-22,18 L-14,18 L-2,-14 L2,-14 L14,18 L6,18 L3,9 L-13,9 L-16,18 Z M-11,3 L1,3 L-5,-10 Z" />
          <path d="M-2,-2 C12,-16 26,-6 26,4 C26,14 14,20 2,16 C0,15 4,12 8,10 C16,7 18,1 14,-4 C10,-8 2,-2 -2,-2 Z" />
          <!-- Eagle eye & beak contour -->
          <circle cx="-1" cy="-7" r="1.8" fill="#ffffff" />
          <path d="M12,-3 C16,-2 21,-5 23,-8 C20,-5 16,-5 12,-3 Z" />
        </g>
      </svg>
    </div>
    <div class="acti-brand-text">
      <h1 class="acti-title">Accounting<br>Certification &amp;<br>Training Institute</h1>
    </div>
  </header>

  <!-- The 3D Neumorphic Verification Card -->
  <main class="auth-3d-card" id="authCard">
    <!-- LEFT PANEL: Inset Frame with 3D Lock / Dial -->
    <div class="auth-3d-left">
      <div class="auth-3d-well" id="auth3dWell">
        <!-- Background concentric ripples inside well -->
        <svg class="well-ripples" viewBox="0 0 320 320" aria-hidden="true">
          <circle cx="160" cy="150" r="75" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
          <circle cx="160" cy="150" r="105" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
          <circle cx="160" cy="150" r="135" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1.5" />
        </svg>

        <!-- STATE A: 3D Neumorphic Padlock (Default) -->
        <div class="visual-lock-wrap" id="visualLock">
          <svg class="lock-3d-svg" viewBox="0 0 160 180" width="130" height="150">
            <defs>
              <!-- Shackle metallic gradient -->
              <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e2f6f8" />
                <stop offset="35%" stop-color="#9bd4dc" />
                <stop offset="70%" stop-color="#468894" />
                <stop offset="100%" stop-color="#1b4b53" />
              </linearGradient>
              <linearGradient id="shackleHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
              </linearGradient>

              <!-- Lock body 3D gradient -->
              <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0f8193" />
                <stop offset="30%" stop-color="#0a6b7a" />
                <stop offset="75%" stop-color="#064f5c" />
                <stop offset="100%" stop-color="#03353e" />
              </linearGradient>

              <!-- Lock body inner shadow / highlight -->
              <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- Shackle shadow on body -->
            <path d="M 54,78 L 54,46 C 54,23 106,23 106,46 L 106,78" fill="none" stroke="#022127" stroke-width="18" stroke-linecap="round" opacity="0.4" />
            <!-- Shackle outer tube -->
            <path d="M 54,76 L 54,44 C 54,22 106,22 106,44 L 106,76" fill="none" stroke="url(#shackleGrad)" stroke-width="17" stroke-linecap="round" />
            <!-- Shackle specular highlight -->
            <path d="M 58,74 L 58,44 C 58,26 102,26 102,44 L 102,74" fill="none" stroke="url(#shackleHighlight)" stroke-width="3.5" stroke-linecap="round" />

            <!-- Lock sockets (inset holes) -->
            <ellipse cx="54" cy="76" rx="10" ry="4" fill="#021c21" opacity="0.6" />
            <ellipse cx="106" cy="76" rx="10" ry="4" fill="#021c21" opacity="0.6" />

            <!-- 3D Lock Body -->
            <g class="lock-body-group">
              <!-- Outer pillow shadow -->
              <rect x="29" y="69" width="102" height="92" rx="22" ry="22" fill="#021a1f" opacity="0.5" filter="url(#softGlow)" />
              <!-- Raised pillowed surface -->
              <rect x="28" y="66" width="104" height="94" rx="22" ry="22" fill="url(#lockBodyGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
              <!-- Top-left rim highlight -->
              <path d="M 50,67 L 110,67 C 122,67 130,75 130,87 L 130,120" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" />

              <!-- Status LED Dot (cyan pulse) -->
              <circle class="led-pulse-dot" cx="112" cy="79" r="4" fill="#22d3ee" />
              <circle cx="112" cy="79" r="2" fill="#ffffff" />

              <!-- Center 3D Keyhole -->
              <g class="lock-keyhole">
                <!-- Outer recessed keyhole ring -->
                <circle cx="80" cy="106" r="11" fill="#021f25" />
                <path d="M 76,106 L 84,106 L 82,124 L 78,124 Z" fill="#021f25" />
                <!-- Inner depth hole -->
                <circle cx="80" cy="106" r="7" fill="#011418" />
                <path d="M 77.5,106 L 82.5,106 L 81.2,122 L 78.8,122 Z" fill="#011418" />
                <!-- Keyhole lower rim highlight -->
                <path d="M 72,110 A 11,11 0 0,0 88,110" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
              </g>
            </g>
          </svg>
        </div>

        <!-- STATE B: 3D Checkmark Dial (Upon Verified) -->
        <div class="visual-dial-wrap" id="visualDial" style="display:none;">
          <svg class="dial-3d-svg" viewBox="0 0 200 200" width="160" height="160">
            <defs>
              <linearGradient id="dialBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0f8193" />
                <stop offset="100%" stop-color="#03353e" />
              </linearGradient>
              <linearGradient id="dialDomeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#149cb2" />
                <stop offset="40%" stop-color="#0b7383" />
                <stop offset="100%" stop-color="#043c46" />
              </linearGradient>
              <filter id="dialGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- Outer shadow -->
            <circle cx="100" cy="103" r="66" fill="#021a1f" opacity="0.6" filter="url(#dialGlow)" />
            <!-- Beveled ring -->
            <circle cx="100" cy="100" r="66" fill="url(#dialBezelGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />
            <!-- Inner recessed groove -->
            <circle cx="100" cy="100" r="54" fill="#021c21" />
            <!-- Raised central dome -->
            <circle cx="100" cy="100" r="48" fill="url(#dialDomeGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />

            <!-- 3D Emerald Checkmark -->
            <path class="dial-check-path" d="M 80,102 L 94,116 L 126,82" fill="none" stroke="#10b981" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 4px 8px rgba(16,185,129,0.5))" />
          </svg>
        </div>

        <!-- Well Footer Labels -->
        <div class="well-footer">
          <span class="well-secure-label">SECURE ACCESS</span>
          <span class="well-protected-label" id="wellStatusTag">
            <span class="status-green-dot"></span> System Protected
          </span>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Authentication Form -->
    <div class="auth-3d-right">
      <div class="auth-header-block">
        <span class="auth-category-tag">AUTHENTICATION</span>
        <h2 class="auth-main-title">Verify Your Identity</h2>
        <p class="auth-sub-desc">Enter the six-digit verification code to unlock protected access to your account.</p>
      </div>

      <!-- 6-digit Code Input Slots -->
      <form id="codeVerifyForm" class="auth-code-form" autocomplete="off" novalidate>
        <!-- Honeypot -->
        <div style="display:none;" aria-hidden="true">
          <input type="text" id="hp" name="hp" tabindex="-1">
        </div>

        <div class="code-boxes-row" id="codeBoxesRow">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box-input" id="digit1" data-idx="0" autofocus>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box-input" id="digit2" data-idx="1">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box-input" id="digit3" data-idx="2">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box-input" id="digit4" data-idx="3">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box-input" id="digit5" data-idx="4">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box-input" id="digit6" data-idx="5">
        </div>

        <!-- 3D Pill Verify Button -->
        <button type="submit" class="btn-3d-verify" id="btnVerifyAccess">
          VERIFY ACCESS
        </button>

        <!-- Google One-Click Sign In -->
        <button type="button" class="btn-3d-google" id="btnGoogleAuth">
          <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign in with Google (dcchamie25@gmail.com)</span>
        </button>

        <!-- Status / Feedback Line -->
        <div class="auth-feedback-status" id="authFeedback">
          Protected by secure verification
        </div>

        <!-- Footer: Timer & Resend Code -->
        <div class="auth-footer-bar">
          <div class="timer-countdown">
            Code expires in <span class="timer-digits" id="timerDigits">02:00</span>
          </div>
          <button type="button" class="btn-resend-action" id="btnResendCode">
            RESEND CODE
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Floating Toast Notification -->
  <div class="toast-notify" id="toastNotify" role="alert"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
